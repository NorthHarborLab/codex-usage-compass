name: Verify plugin and native system rings
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Windows native icon and menu smoke test
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/verify-windows.ps1
      - name: Windows plugin startup and shutdown
        if: runner.os == 'Windows'
        shell: powershell
        run: node scripts/verify-native-lifecycle.mjs
      - name: macOS native menu and ring smoke test
        if: runner.os == 'macOS'
        run: node scripts/verify-macos.mjs
      - name: macOS plugin startup and shutdown
        if: runner.os == 'macOS'
        run: node scripts/verify-native-lifecycle.mjs
      - name: Install Codex for native plugin loader test
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: npm install --no-save --package-lock=false @openai/codex
      - name: Clean Codex plugin installation
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: node scripts/verify-host.mjs node_modules/@openai/codex/bin/codex.js
